[project]
name = "ie-agent"
version = "0.1.0"
description = "Agentic subject indexing with GND subject headings, reading like human indexers (Agent IE with KAG)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.0",
    "openai>=1.60",
    "pandas>=2.2",
    "pyarrow>=20.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.1",
    "weaviate-client>=4.22.0",
]

[project.scripts]
ie-agent = "ie_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ie_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
