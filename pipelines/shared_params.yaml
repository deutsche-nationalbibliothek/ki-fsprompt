vocab:
  weaviate_collection_name: ki_fsprompt_vocab
  manifest_out: vocab/create_vocab_collection_manifest.json
  ttl_file: vocab/GND-Subjects-plus.ttl
  use_altLabels: true
  prefLabels_csv: vocab/prefLabels.csv

embedding:
  model: BAAI/bge-m3 # this needs to be changed in the TEI docker configuration as well
  TEI_port: 8090 # this needs to be changed in the TEI docker configuration as well
  batch_size: 300  # for embedding model processing of vocab

retrieve:
  weaviate_collection_name: abstract_intro_train  # make a new Collection
  manifest_out: create_train_collection_manifest.json
  # n_examples: the number of closest examples to retrieve for each document in the test set
  n_examples: 5
  # where to store the retrieved examples for each document in the test/ validate set
  prompt_file: retrieved_examples.csv


vllm:
  engineargs:
    # task: generate
    gpu_memory_utilization: 0.80
    tensor_parallel_size: 1
    dtype: auto
    enforce_eager: true
    max_model_len: 40000
  global_samplingparams:
    presence_penalty: 0
    frequency_penalty: 0
    repetition_penalty: 1
    top_p: 1

completion:
  # this is a recycled name used for the output file of any completion run 
  completion_filename: completions.csv
  # how many docs to process in one pass of inference with vllm
  custom_instruction: instructions/instruction_abstract_intro.txt
  vllm:
    samplingparams:
      max_new_tokens: 256
      min_new_tokens: 0
      max_total_tokens: 40000
      max_chunks: 1
      temperature: 0
  models:
    mistral-7B-0p3:
      hf_model_name: mistralai/Mistral-7B-Instruct-v0.3
      short_name: mistral-7B-0p3
    llama-3B-instruct:
      hf_model_name: meta-llama/Llama-3.2-3B-Instruct
      short_name: llama-3B
    ministral-3-8B-instruct:
      hf_model_name: mistralai/Ministral-3-8B-Instruct-2512
      short_name: ministral-3-8B-instruct
    ministral-3-14B-instruct:
      hf_model_name: mistralai/Ministral-3-14B-Instruct-2512
      short_name: ministral-3-14B-instruct
    qwen-3p5-35B-A3B:
      hf_model_name: Qwen/Qwen3.5-35B-A3B
      short_name: qwen-3p5-35B-A3B
    qwen-3-4B:
      hf_model_name: Qwen/Qwen3-4B
      short_name: qwen-3-4B
      # gated repo
    gemma-4-26B-A4B-it:
      hf_model_name: google/gemma-4-26B-A4B-it
      short_name: gemma-4-26B-A4B-it
    occiglot-7B-eu5-instruct:
      hf_model_name: occiglot/occiglot-7b-eu5-instruct
      short_name: occiglot-7B
    phi-3p5-mini-instruct:
      hf_model_name: microsoft/Phi-3.5-mini-instruct
      short_name: phi-3p5-mini
    apertus-8B:
      hf_model_name: swiss-ai/Apertus-8B-Instruct-2509
      short_name: apertus-8B
    qwen-3p8-27B-fp8:
      hf_model_name: Qwen/Qwen3.8-27B-FP8
      short_name: qwen-3p8-27B
    gemma-4-31B-it:
      hf_model_name: RedHatAI/gemma-4-31B-it-FP8-block
      short_name: gemma-4-31B-fp8

mapping:
  output_file: mapped_predictions.csv
  # how many parallel clients query weaviate 
  n_processes: 20
  # the output will contain a column "score" which is either the cosine similarity or the hybrid score
  score_param: hybrid_score # choice: cosine_similarity, hybrid_score
  hyperparameters:
    search: hybrid        # options: hybrid, vector
    min_cosine_similarity: 0.7 # threshold for vector search
    alpha: 0.7       # 0 - 1

ranking:
  model: Qwen/Qwen3.8-27B
  score_param: relevance # choice: relevance, score, cosine_similarity, hybrid_score
  temperature: 0
  instruction: instructions/ranking_instruction03.json
  max_suggestions: 100
  min_confidence: 0
  threshold_confidence: 0
  max_confidence: 10
  output_file: ranked_predictions.csv
  # opt-in chain-of-thought before the relevance score is emitted
  enable_thinking: false
  # vLLM reasoning parser name (e.g. qwen3, deepseek_r1, gemma4, mistral); required if enable_thinking is true
  reasoning_parser: None
  # extra token budget reserved for reasoning, added on top of the score's own token budget
  max_reasoning_tokens: 512

train_xgb:
  model_file: xgb_model.rds
  importance_plot: xgb_model_feature_importance.png
  n_jobs: 40
  hyperparameters:
    n_rounds: 874
    interaction_depth: 2
    shrinkage: 0.02058179685107834
    subsample: 0.69631089647747
    verbose: true


# Matrix aus Bedingungen × Modellen
# Das ursprüngliche Setup (Projekt von Herrn Kähler) verglich verschiedene Modelle auf einem festen Datensatz (Titel).
# in meinem Fall macht es sinn, den Setup zu updaten
# indem man zusätzlich Textselektionen (Sections und Bedingungen) verglichen kann.
# Jede Kombination aus runs (unten) ist eine eigene DVC-Stufe.
conditions:
  title: &title
    name: title
    train: ../preprocess/train.csv
    validate: ../preprocess/validate.csv
    validate_index: ../../corpora/title/validate.arrow
    collection: title
    instruction: instructions/instruction_title.txt
  abstract_intro: &abstract_intro
    name: abstract_intro
    train: ../preprocess/preprocessed/Sections/abstract_intro/train.csv
    validate: ../preprocess/preprocessed/Sections/abstract_intro/validate.csv
    validate_index: ../preprocess/preprocessed/Sections/abstract_intro/validate.arrow
    collection: abstract_intro_train
    instruction: instructions/instruction_abstract_intro.txt
  toc_strict: &toc_strict
    name: toc_strict
    train: ../preprocess/preprocessed/Sections/toc_strict/train.csv
    validate: ../preprocess/preprocessed/Sections/toc_strict/validate.csv
    validate_index: ../preprocess/preprocessed/Sections/toc_strict/validate.arrow
    collection: toc_strict_train
    instruction: instructions/instruction_toc.txt
  title_abstract_intro: &title_abstract_intro          # Bedingung C
    name: title_abstract_intro
    train: ../preprocess/preprocessed/bedingungen/title_abstract_intro/train.csv
    validate: ../preprocess/preprocessed/bedingungen/title_abstract_intro/validate.csv
    validate_index: ../preprocess/preprocessed/bedingungen/title_abstract_intro/validate.arrow
    collection: title_abstract_intro_train
    instruction: instructions/instruction_title_abstract_intro.txt
  abstract_intro_toc: &abstract_intro_toc          # Bedingung D
    name: abstract_intro_toc
    train: ../preprocess/preprocessed/bedingungen/abstract_intro_toc/train.csv
    validate: ../preprocess/preprocessed/bedingungen/abstract_intro_toc/validate.csv
    validate_index: ../preprocess/preprocessed/bedingungen/abstract_intro_toc/validate.arrow
    collection: abstract_intro_toc_train
    instruction: instructions/instruction_abstract_intro_toc.txt

# nur die Modelle, die in den Bedingungsvergleich gehen
study_models:
  mistral-7B-0p3: &mistral
    hf_model_name: mistralai/Mistral-7B-Instruct-v0.3
    short_name: mistral-7B-0p3
  qwen-3p8-27B: &qwen
    hf_model_name: Qwen/Qwen3.8-27B-FP8
    short_name: qwen-3p8-27B
  gemma-4-31B-fp8: &gemma
    hf_model_name: RedHatAI/gemma-4-31B-it-FP8-block
    short_name: gemma-4-31B-fp8

# Welche Kombinationen aus Bedingung × Modell laufen sollen.
# Schlüssel = Stufenname, z. B. complete@toc_strict-qwen-3p8-27B.
# Eine Kombination auskommentieren = sie wird keine DVC-Stufe.

# Warum & und *: YAML-Anker. &name (oben bei conditions / study_models) gibt einem Block einen Namen,
# *name setzt hier eine Kopie dieses Blocks ein. So steht jede Bedingung und jedes Modell nur einmal
# in der Datei, und eine Änderung (z. B. Pfad oder Instruktion) gilt automatisch für alle Kombinationen.
# Nötig ist das, weil DVCs matrix bei einem Dict nur den Schlüssel liefert, nicht die Felder
# (${item.cond.train} geht dort nicht). Daher foreach über runs, wo jeder Eintrag beide Blöcke enthält.
# Achtung: dvc exp run -S schreibt die Datei neu und kann die Anker entfernen.
runs:
  title-mistral-7B-0p3:                  {cond: *title,                 model: *mistral}
  title-qwen-3p8-27B:                    {cond: *title,                 model: *qwen}
  title-gemma-4-31B-fp8:                 {cond: *title,                 model: *gemma}
  abstract_intro-mistral-7B-0p3:         {cond: *abstract_intro,        model: *mistral}
  abstract_intro-qwen-3p8-27B:           {cond: *abstract_intro,        model: *qwen}
  abstract_intro-gemma-4-31B-fp8:        {cond: *abstract_intro,        model: *gemma}
  toc_strict-mistral-7B-0p3:             {cond: *toc_strict,            model: *mistral}
  toc_strict-qwen-3p8-27B:               {cond: *toc_strict,            model: *qwen}
  toc_strict-gemma-4-31B-fp8:            {cond: *toc_strict,            model: *gemma}
  title_abstract_intro-mistral-7B-0p3:   {cond: *title_abstract_intro,  model: *mistral}
  title_abstract_intro-qwen-3p8-27B:     {cond: *title_abstract_intro,  model: *qwen}
  title_abstract_intro-gemma-4-31B-fp8:  {cond: *title_abstract_intro,  model: *gemma}
  abstract_intro_toc-mistral-7B-0p3:     {cond: *abstract_intro_toc,    model: *mistral}
  abstract_intro_toc-qwen-3p8-27B:       {cond: *abstract_intro_toc,    model: *qwen}
  abstract_intro_toc-gemma-4-31B-fp8:    {cond: *abstract_intro_toc,    model: *gemma}
