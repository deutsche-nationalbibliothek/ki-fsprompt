datasets:
  title_train:
    tsv_gz_file: ../../corpora/title/train.tsv.gz
    index_file: ../../corpora/title/train.arrow
    output: train.csv
  title_validate:
    tsv_gz_file: ../../corpora/title/validate.tsv.gz
    index_file: ../../corpora/title/validate.arrow
    output: validate.csv
  title_test:
    tsv_gz_file: ../../corpora/title/test.tsv.gz
    index_file: ../../corpora/title/test.arrow
    output: test.csv

#Cezars Teile:

# 1: TOC-Extraktion
toc:
  part_dir: ../../corpora/Sections/TOC_Extraction
  part_suffix: _TOC.md
  cleaning: toc
  # drop: documents without a TOC ("Kein Inhaltsverzeichnis gefunden") are removed from CSV and index
  empty_policy: drop

toc_datasets:
  toc_train:
    index_file: ../../corpora/title/train.arrow
    output: toc/train.csv
    index_output: toc/train.arrow
  toc_validate:
    index_file: ../../corpora/title/validate.arrow
    output: toc/validate.csv
    index_output: toc/validate.arrow
  toc_test:
    index_file: ../../corpora/title/test.arrow
    output: toc/test.csv
    index_output: toc/test.arrow


# 2: TOC-Extraktion mit Entfernung der Strukturwoerter (Vergleichsbedingung zu 1)
toc_strict:
  part_dir: ../../corpora/Sections/TOC_Extraction
  part_suffix: _TOC.md
  cleaning: toc_strict
  empty_policy: drop

toc_strict_datasets:
  toc_strict_train:
    index_file: ../../corpora/title/train.arrow
    output: toc_strict/train.csv
    index_output: toc_strict/train.arrow
  toc_strict_validate:
    index_file: ../../corpora/title/validate.arrow
    output: toc_strict/validate.csv
    index_output: toc_strict/validate.arrow
  toc_strict_test:
    index_file: ../../corpora/title/test.arrow
    output: toc_strict/test.csv
    index_output: toc_strict/test.arrow


# 3: Abstract, wo keins vorhanden ist: Einleitung (erste 8.000 Zeichen)
abstract_intro:
  primary_dir: ../../corpora/Sections/Abstract_Extraction
  primary_suffix: _abstract.md
  fallback_dir: ../../corpora/Sections/Intro_Extraction_8k
  fallback_suffix: _intro.md
  cleaning: none
  # drop: documents with neither abstract nor introduction are removed from CSV and index
  empty_policy: drop

abstract_intro_datasets:
  abstract_intro_train:
    index_file: ../../corpora/title/train.arrow
    output: abstract_intro/train.csv
    index_output: abstract_intro/train.arrow
    source_output: abstract_intro/train_sources.csv
  abstract_intro_validate:
    index_file: ../../corpora/title/validate.arrow
    output: abstract_intro/validate.csv
    index_output: abstract_intro/validate.arrow
    source_output: abstract_intro/validate_sources.csv
  abstract_intro_test:
    index_file: ../../corpora/title/test.arrow
    output: abstract_intro/test.csv
    index_output: abstract_intro/test.arrow
    source_output: abstract_intro/test_sources.csv


# 4: Titel + (Abstract, sonst Einleitung) — Bedingung C
title_abstract_intro_datasets:
  title_abstract_intro_train:
    title_csv: train.csv
    text_csv: abstract_intro/train.csv
    sources_csv: abstract_intro/train_sources.csv
    index_file: ../../corpora/title/train.arrow
    output: title_abstract_intro/train.csv
    index_output: title_abstract_intro/train.arrow
  title_abstract_intro_validate:
    title_csv: validate.csv
    text_csv: abstract_intro/validate.csv
    sources_csv: abstract_intro/validate_sources.csv
    index_file: ../../corpora/title/validate.arrow
    output: title_abstract_intro/validate.csv
    index_output: title_abstract_intro/validate.arrow
  title_abstract_intro_test:
    title_csv: test.csv
    text_csv: abstract_intro/test.csv
    sources_csv: abstract_intro/test_sources.csv
    index_file: ../../corpora/title/test.arrow
    output: title_abstract_intro/test.csv
    index_output: title_abstract_intro/test.arrow
