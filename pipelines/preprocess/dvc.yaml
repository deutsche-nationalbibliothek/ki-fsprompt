vars:
  - ../shared_params.yaml
  - params.yaml

stages:
  extract_prefLabels:
    frozen: false
    wdir: ../../
    desc: Extract the preferred labels from the vocab ttl file and store them in a csv file for later use.
    cmd:
      - >
        python src/extract_prefLabels.py \
          --ttl_file ${vocab.ttl_file} \
          --csv_output ${vocab.prefLabels_csv}
    deps:
      - src/extract_prefLabels.py
      - src/create_vocab_collection.py
      - ${vocab.ttl_file}
    params:
      - pipelines/shared_params.yaml:
        - vocab.prefLabels_csv
    outs:
      - ${vocab.prefLabels_csv}

  preprocess:
    foreach: ${datasets}
    do:
      cmd:
        - > 
          python ../../src/preprocess.py \
            --tsv_gz_file ${item.tsv_gz_file} \
            --index_file ${item.index_file} \
            --gnd_pref_labels ../../${vocab.prefLabels_csv} \
            --csv_output ${item.output}
      deps:
        - ../../src/preprocess.py
        - ../../src/data_adapters
        - ${item.tsv_gz_file}
        - ${item.index_file}
        - ../../${vocab.prefLabels_csv}
      outs:
        - ${item.output}


#Cezars Teile:

# 1: TOC-Extraktion 

  preprocess_toc:
    foreach: ${toc_datasets}
    do:
      desc: Docling-TOC per idn, split assignment from corpora/title/*.arrow, labels from ground-truth.arrow
      cmd:
        - >
          python ../../src/preprocess_selektion.py \
            --part_dir ${toc.part_dir} \
            --part_suffix ${toc.part_suffix} \
            --cleaning ${toc.cleaning} \
            --empty_policy ${toc.empty_policy} \
            --index_file ${item.index_file} \
            --ground_truth ../../corpora/ground-truth.arrow \
            --csv_output ${item.output} \
            --index_output ${item.index_output}
      deps:
        - ../../src/preprocess_selektion.py
        - ../../src/data_adapters
        - ${toc.part_dir}
        - ../../corpora/ground-truth.arrow
        - ${item.index_file}
      params:
        - toc
      outs:
        - ${item.output}
        - ${item.index_output}


# 2: TOC-Extraktion ohne Strukturwoerter

  preprocess_toc_strict:
    foreach: ${toc_strict_datasets}
    do:
      desc: Like preprocess_toc, but with structural headings and repeated lines removed
      cmd:
        - >
          python ../../src/preprocess_selektion.py \
            --part_dir ${toc_strict.part_dir} \
            --part_suffix ${toc_strict.part_suffix} \
            --cleaning ${toc_strict.cleaning} \
            --empty_policy ${toc_strict.empty_policy} \
            --index_file ${item.index_file} \
            --ground_truth ../../corpora/ground-truth.arrow \
            --csv_output ${item.output} \
            --index_output ${item.index_output}
      deps:
        - ../../src/preprocess_selektion.py
        - ../../src/data_adapters
        - ${toc_strict.part_dir}
        - ../../corpora/ground-truth.arrow
        - ${item.index_file}
      params:
        - toc_strict
      outs:
        - ${item.output}
        - ${item.index_output}


# 3: Abstract, sonst Einleitung (8k)

  preprocess_abstract_intro:
    foreach: ${abstract_intro_datasets}
    do:
      desc: Abstract per idn, introduction (first 8k chars) as fallback where no abstract exists
      cmd:
        - >
          python ../../src/preprocess_selektion.py \
            --part_dir ${abstract_intro.primary_dir} ${abstract_intro.fallback_dir} \
            --part_suffix ${abstract_intro.primary_suffix} ${abstract_intro.fallback_suffix} \
            --cleaning ${abstract_intro.cleaning} \
            --empty_policy ${abstract_intro.empty_policy} \
            --index_file ${item.index_file} \
            --ground_truth ../../corpora/ground-truth.arrow \
            --csv_output ${item.output} \
            --index_output ${item.index_output} \
            --source_output ${item.source_output}
      deps:
        - ../../src/preprocess_selektion.py
        - ../../src/data_adapters
        - ${abstract_intro.primary_dir}
        - ${abstract_intro.fallback_dir}
        - ../../corpora/ground-truth.arrow
        - ${item.index_file}
      params:
        - abstract_intro
      outs:
        - ${item.output}
        - ${item.index_output}
        - ${item.source_output}
