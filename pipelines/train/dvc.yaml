vars:
  - ../shared_params.yaml
  - params.yaml

stages:
  create_vocab_collection:
    frozen: false
    desc: Create a Weaviate collection with the embeddings for the mapping stage.
    cmd:
      - >
        python ../../src/create_vocab_collection.py \
          --ttl_file ../../${vocab.ttl_file} \
          --collection_name ${vocab.weaviate_collection_name} \
          --model_name ${embedding.model} \
          --overwrite true\
          --TEI_port ${embedding.TEI_port} \
          --use_altLabels ${vocab.use_altLabels} \
          --manifest_out ../../${vocab.manifest_out}
    deps:
      - ../../src/create_vocab_collection.py
      - ../../src/generate_embeddings.py
      - ../../${vocab.ttl_file}
    params:
      - ../shared_params.yaml:
        - vocab.weaviate_collection_name
        - embedding.model
        - embedding.batch_size
        - vocab.use_altLabels
        - vocab.manifest_out
    outs:
      - ../../${vocab.manifest_out}:
          cache: false

  # Bedingungen × Modelle, siehe conditions / study_models / runs in shared_params.yaml.
  # Ergebnisse landen in results/<bedingung>_validate/<modell>/.
  # Collection und Retrieval hängen nur von der Bedingung ab (foreach über conditions),
  # complete, map und compute_metrics_modelwise von Bedingung und Modell (foreach über runs).

  create_train_collection:
    foreach: ${conditions}
    do:
      desc: Create a collection for the potential prompt documents of one condition
      frozen: false
      cmd:
        - >
          python ../../src/create_train_collection.py \
            --text_data ${item.train} \
            --collection_name ${item.collection} \
            --text_type ${train.text_type} \
            --chunk_size ${train.chunk_size} \
            --batch_size ${train.batch_size} \
            --embedding_model ${embedding.model} \
            --manifest_out results/${item.name}_validate/collection_manifest.json \
            --overwrite
      deps:
        - ../../src/create_train_collection.py
        - ${item.train}
      params:
        - train.text_type
        - train.chunk_size
        - train.batch_size
        - ../shared_params.yaml:
          - embedding.model
      outs:
        - results/${item.name}_validate/collection_manifest.json:
            cache: false

  retrieve:
    foreach: ${conditions}
    do:
      desc: Get the closest examples for each validation document of one condition
      cmd:
        - >
          python ../../src/retrieve.py \
            --input_text_data ${item.validate} \
            --output_file results/${item.name}_validate/retrieved_examples.csv \
            --n_examples ${retrieve.n_examples} \
            --host ${embedding.TEI_port} \
            --collection_name ${item.collection}
      deps:
        - ../../src/retrieve.py
        - ${item.validate}
        - results/${item.name}_validate/collection_manifest.json
      params:
        - ../shared_params.yaml:
          - retrieve.n_examples
          - embedding.model
      outs:
        - results/${item.name}_validate/retrieved_examples.csv

  complete:
    foreach: ${runs}
    do:
      desc: Generate free keywords for one condition x model combination
      cmd:
      - mkdir -p results/${item.cond.name}_validate/${item.model.short_name}/
      - >
        python ../../src/completion.py \
          --hf_model_name ${item.model.hf_model_name} \
          --dataset_file ${item.cond.validate} \
          --completion_file results/${item.cond.name}_validate/${item.model.short_name}/${completion.completion_filename} \
          --prompt_specification results/${item.cond.name}_validate/retrieved_examples.csv \
          --custom_instructions ../../${item.cond.instruction} \
          --params_file ../shared_params.yaml 
      params:
        - ../shared_params.yaml:
          - completion.vllm.samplingparams.max_new_tokens
          - completion.vllm.samplingparams.min_new_tokens
          - completion.vllm.samplingparams.max_total_tokens
          - completion.vllm.samplingparams.max_chunks
          - completion.vllm.samplingparams.temperature
          - vllm.global_samplingparams.presence_penalty
          - vllm.global_samplingparams.frequency_penalty
          - vllm.global_samplingparams.repetition_penalty
          - vllm.global_samplingparams.top_p
      deps:
      - ../../src/completion.py
      - ../../src/PromptBuilder.py
      - ${item.cond.validate}
      - results/${item.cond.name}_validate/retrieved_examples.csv
      - ../../${item.cond.instruction}
      outs:
      - results/${item.cond.name}_validate/${item.model.short_name}/${completion.completion_filename}
      - results/${item.cond.name}_validate/${item.model.short_name}/gpu_log.csv
      metrics:
      - results/${item.cond.name}_validate/${item.model.short_name}/resource_stats.json:
          cache: false

  map:
    foreach: ${runs}
    do:
      desc: Map keywords to GND subject terms for one condition x model combination
      cmd:
      - > 
        python ../../src/mapping.py \
          --completion_file results/${item.cond.name}_validate/${item.model.short_name}/${completion.completion_filename} \
          --output_file results/${item.cond.name}_validate/${item.model.short_name}/${mapping.output_file} \
          --mapping_stats results/${item.cond.name}_validate/${item.model.short_name}/mapping_stats.json \
          --params_file ../shared_params.yaml 
      params:
      - ../shared_params.yaml:
        - vocab.weaviate_collection_name
        - mapping.hyperparameters.search
        - mapping.hyperparameters.min_cosine_similarity
        - mapping.hyperparameters.alpha
        - embedding.model
      deps:
      - ../../src/mapping.py
      - results/${item.cond.name}_validate/${item.model.short_name}/${completion.completion_filename}
      - ../../${vocab.manifest_out}
      outs:
      - results/${item.cond.name}_validate/${item.model.short_name}/${mapping.output_file}
      - results/${item.cond.name}_validate/${item.model.short_name}/removed_mapped_predictions.csv
      metrics:
      - results/${item.cond.name}_validate/${item.model.short_name}/mapping_stats.json:
          cache: false

  compute_metrics_modelwise:
    foreach: ${runs}
    do:
      desc: Compute metrics for one condition x model combination
      cmd:
        - >
          Rscript ../../src/compute_metrics.R \
            --predictions results/${item.cond.name}_validate/${item.model.short_name}/${mapping.output_file} \
            --index ${item.cond.validate_index} \
            --ground-truth ../../corpora/ground-truth.arrow \
            --res_dir results/${item.cond.name}_validate/${item.model.short_name}/ \
            --kind ${predict.text_type} \
            --n_threads 20 \
            --set_retrieval_only TRUE 
      deps:
        - ../../src/compute_metrics.R
        - results/${item.cond.name}_validate/${item.model.short_name}/${mapping.output_file}
        - ${item.cond.validate_index}
        - ../../corpora/ground-truth.arrow
      params:
        - predict.text_type
      metrics:
        - results/${item.cond.name}_validate/${item.model.short_name}/scores_at_100_R.yaml:
            cache: false

  summarize:
    desc: Run summarize-stage
    always_changed: false 
    cmd:
    - > 
      python ../../src/summarize_candidates.py \
          predictions_model_wise/mistral-7B-0p3/${mapping.output_file} \
          predictions_model_wise/llama-3B/${mapping.output_file} \
          predictions_model_wise/ministral-3-8B-instruct/${mapping.output_file} \
          predictions_model_wise/ministral-3-14B-instruct/${mapping.output_file} \
          predictions_model_wise/qwen-3p5-35B-A3B/${mapping.output_file} \
          predictions_model_wise/qwen-3-4B/${mapping.output_file} \
          predictions_model_wise/gemma-4-26B-A4B-it/${mapping.output_file} \
          predictions_model_wise/occiglot-7B/${mapping.output_file} \
          predictions_model_wise/phi-3p5-mini/${mapping.output_file} \
          predictions_model_wise/apertus-8B/${mapping.output_file} \
        --output_file  ${mapping.output_file}
    deps:
    - ../../src/summarize_candidates.py
    - predictions_model_wise/mistral-7B-0p3/${mapping.output_file}
    - predictions_model_wise/llama-3B/${mapping.output_file}
    - predictions_model_wise/ministral-3-8B-instruct/${mapping.output_file}
    - predictions_model_wise/ministral-3-14B-instruct/${mapping.output_file}
    - predictions_model_wise/qwen-3p5-35B-A3B/${mapping.output_file}
    - predictions_model_wise/qwen-3-4B/${mapping.output_file}
    - predictions_model_wise/gemma-4-26B-A4B-it/${mapping.output_file}
    - predictions_model_wise/occiglot-7B/${mapping.output_file}
    - predictions_model_wise/phi-3p5-mini/${mapping.output_file}
    - predictions_model_wise/apertus-8B/${mapping.output_file}
    outs:
    - ${mapping.output_file}


  rank:
    desc: Run rank-stage for all ensemble-strategies
    cmd:
    - > 
      python ../../src/rank.py \
        --dataset_file ${predict.text_data} \
        --predictions_file ${mapping.output_file} \
        --output_file ${ranking.output_file} \
        --params_file ../shared_params.yaml \
        --custom_instructions ../../${ranking.instruction}
    params:
    - ../shared_params.yaml:
      - vllm.global_samplingparams.presence_penalty
      - vllm.global_samplingparams.frequency_penalty
      - vllm.global_samplingparams.repetition_penalty
      - vllm.global_samplingparams.top_p
      - ranking.model
      - ranking.temperature
      - ranking.instruction
      - ranking.max_suggestions
      - ranking.min_confidence
      - ranking.threshold_confidence
      - ranking.max_confidence
      - ranking.score_param
      - ranking.enable_thinking
      - ranking.reasoning_parser
      - ranking.max_reasoning_tokens
    deps:
    - ../../src/rank.py
    - ${mapping.output_file}
    - ${predict.text_data}
    - ../../${ranking.instruction}
    outs:
    - ${ranking.output_file}

  train_xgb:
    desc: Train XGBoost model
    cmd:
      - >
        python ../../src/train_xgb.py \
          predictions_model_wise/mistral-7B-0p3/${mapping.output_file} \
          predictions_model_wise/llama-3B/${mapping.output_file} \
          predictions_model_wise/ministral-3-8B-instruct/${mapping.output_file} \
          predictions_model_wise/ministral-3-14B-instruct/${mapping.output_file} \
          predictions_model_wise/qwen-3p5-35B-A3B/${mapping.output_file} \
          predictions_model_wise/qwen-3-4B/${mapping.output_file} \
          predictions_model_wise/gemma-4-26B-A4B-it/${mapping.output_file} \
          predictions_model_wise/occiglot-7B/${mapping.output_file} \
          predictions_model_wise/phi-3p5-mini/${mapping.output_file} \
          predictions_model_wise/apertus-8B/${mapping.output_file} \
          --ground_truth ../../corpora/ground-truth.arrow \
          --train_index ${predict.index} \
          --ranked_predictions ${ranking.output_file} \
          --model_file ${train_xgb.model_file} \
          --n_rounds ${train_xgb.hyperparameters.n_rounds} \
          --interaction_depth ${train_xgb.hyperparameters.interaction_depth}\
          --shrinkage ${train_xgb.hyperparameters.shrinkage} \
          --subsample ${train_xgb.hyperparameters.subsample} \
          --importance_plot ${train_xgb.importance_plot}
    params:
      - ../shared_params.yaml:
        - train_xgb.hyperparameters.n_rounds
        - train_xgb.hyperparameters.interaction_depth
        - train_xgb.hyperparameters.shrinkage
        - train_xgb.hyperparameters.subsample
    deps:
      - ../../src/train_xgb.py
      - ${predict.index}
      - ../../corpora/ground-truth.arrow
      - ${ranking.output_file}
      - predictions_model_wise/mistral-7B-0p3/${mapping.output_file}
      - predictions_model_wise/llama-3B/${mapping.output_file}
      - predictions_model_wise/ministral-3-8B-instruct/${mapping.output_file}
      - predictions_model_wise/ministral-3-14B-instruct/${mapping.output_file}
      - predictions_model_wise/qwen-3p5-35B-A3B/${mapping.output_file}
      - predictions_model_wise/qwen-3-4B/${mapping.output_file}
      - predictions_model_wise/gemma-4-26B-A4B-it/${mapping.output_file}
      - predictions_model_wise/occiglot-7B/${mapping.output_file}
      - predictions_model_wise/phi-3p5-mini/${mapping.output_file}
      - predictions_model_wise/apertus-8B/${mapping.output_file}
    outs:
      - ${train_xgb.model_file}
      - ${train_xgb.importance_plot}:
          cache: false